name: End of Year Planning Report

on:
  workflow_dispatch:      # Manual trigger only
    inputs:
      report_type:
        description: 'Report type'
        required: true
        default: 'rolling'
        type: choice
        options:
          - 'rolling'
          - 'year_2025'
          - 'year_2024'
          - 'custom'
          - 'monthly_review'
      custom_start:
        description: 'Custom start month (YYYY-MM, only for custom type)'
        required: false
        default: ''
        type: string
      custom_end:
        description: 'Custom end month (YYYY-MM, only for custom type)'
        required: false
        default: ''
        type: string
      review_month:
        description: 'Review month (YYYY-MM, only for monthly_review type — leave blank for previous month)'
        required: false
        default: ''
        type: string

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas requests pytz python-dateutil
          pip install google-analytics-data google-auth google-auth-oauthlib google-auth-httplib2
          pip install matplotlib wordcloud

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache S3 files
        uses: actions/cache@v5
        with:
          path: .cache
          key: s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-eoy-planning
          restore-keys: |
            s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-
            s3-cache-${{ runner.os }}-

      - name: Run EOY Planning Report
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        run: |
          # Build command based on report type
          REPORT_TYPE="${{ github.event.inputs.report_type }}"
          OUTPUT_FILE="eoy_planning_report_$(date +'%Y%m%d_%H%M%S').csv"

          if [ "$REPORT_TYPE" = "rolling" ]; then
            echo "Running rolling 12-month report..."
            python3 eoy_planning_report.py --rolling --output "$OUTPUT_FILE"
          elif [ "$REPORT_TYPE" = "year_2025" ]; then
            echo "Running full year 2025 report..."
            python3 eoy_planning_report.py --year 2025 --output "$OUTPUT_FILE"
          elif [ "$REPORT_TYPE" = "year_2024" ]; then
            echo "Running full year 2024 report..."
            python3 eoy_planning_report.py --year 2024 --output "$OUTPUT_FILE"
          elif [ "$REPORT_TYPE" = "custom" ]; then
            CUSTOM_START="${{ github.event.inputs.custom_start }}"
            CUSTOM_END="${{ github.event.inputs.custom_end }}"

            if [ -z "$CUSTOM_START" ] || [ -z "$CUSTOM_END" ]; then
              echo "Error: Custom report type requires both start and end dates"
              exit 1
            fi

            echo "Running custom report from $CUSTOM_START to $CUSTOM_END..."
            python3 eoy_planning_report.py --start "$CUSTOM_START" --end "$CUSTOM_END" --output "$OUTPUT_FILE"
          elif [ "$REPORT_TYPE" = "monthly_review" ]; then
            REVIEW_MONTH="${{ github.event.inputs.review_month }}"

            if [ -z "$REVIEW_MONTH" ]; then
              echo "Running monthly review (auto-detecting previous month)..."
              python3 eoy_planning_report.py --monthly-review
            else
              echo "Running monthly review for $REVIEW_MONTH..."
              python3 eoy_planning_report.py --monthly-review "$REVIEW_MONTH"
            fi
          fi

          # Store output filename for artifact upload
          echo "OUTPUT_FILE=$OUTPUT_FILE" >> $GITHUB_ENV

      - name: List generated files
        if: always()
        run: |
          echo "=== Generated report files ==="
          echo "Root level:"
          ls -la eoy_planning_report*.csv 2>/dev/null || echo "  No root files found"
          echo ""
          for folder in planning seasonality industry cohorts geography keywords ppc boxoffice; do
            if [ -d "$folder" ]; then
              echo "$folder/:"
              ls -la "$folder"/*.csv 2>/dev/null || echo "  No files in $folder"
              echo ""
            fi
          done
          echo ""
          echo "=== MBR directories ==="
          for mbr_dir in mbr_*/; do
            if [ -d "$mbr_dir" ]; then
              echo "$mbr_dir:"
              find "$mbr_dir" -type f | head -50
              echo ""
            fi
          done

      - name: Upload EOY Planning Report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: eoy-planning-report-${{ steps.date.outputs.date }}
          path: |
            eoy_planning_report*.csv
            planning/
            seasonality/
            industry/
            cohorts/
            geography/
            keywords/
            ppc/
            boxoffice/
            mbr_*/
          retention-days: 90
