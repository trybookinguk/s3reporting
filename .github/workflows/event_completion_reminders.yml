name: Event Completion Reminders

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode - log events without sending'
        type: boolean
        default: false
      test_date:
        description: 'Process events from specific date (YYYY-MM-DD)'
        type: string

jobs:
  event-reminders:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      
      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas numpy requests pytz
      
      - name: Cache S3 data files
        uses: actions/cache@v5
        with:
          path: modules/utils/.cache
          key: s3-cache-${{ github.run_id }}-${{ github.run_number }}
          restore-keys: |
            s3-cache-
      
      - name: Run Event Completion Reminders
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          VERO_API_KEY: ${{ secrets.VERO_API_KEY }}
          TEST_MODE: ${{ inputs.test_mode }}
          TEST_DATE: ${{ inputs.test_date }}
        run: |
          echo "Running Event Completion Reminders"
          echo "Test mode: $TEST_MODE"
          echo "Test date: $TEST_DATE"
          python event_completion_reminders.py
      
      - name: Upload output files
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: event-reminders-output
          path: |
            event_completion_reminders_*.csv
            event_completion_audit_*.csv
          retention-days: 30