name: Export GA4 Creds
on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Write credentials to file
        run: |
          echo "$GA4_PROPERTY_ID" > ga4_property_id.txt
          echo "$GA4_SERVICE_ACCOUNT_KEY" > ga4_service_account_key.json
        env:
          GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
          GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}

      - name: Upload credentials artifact
        uses: actions/upload-artifact@v4
        with:
          name: ga4-credentials
          path: |
            ga4_property_id.txt
            ga4_service_account_key.json
          retention-days: 1
