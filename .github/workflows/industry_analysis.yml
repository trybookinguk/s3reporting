name: Industry Analysis Report

on:
  workflow_dispatch:

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas pytz requests msal

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache S3 files
        uses: actions/cache@v5
        with:
          path: .cache
          # Cache key includes date to ensure fresh data each day
          key: s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-${{ hashFiles('**/industry_analysis.py') }}
          restore-keys: |
            s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-
            s3-cache-${{ runner.os }}-

      - name: Run Industry Analysis
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SENDER_MAILBOX: ${{ secrets.AZURE_SENDER_MAILBOX }}
        run: python industry_analysis.py

      - name: Upload CSV reports as artifacts
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: industry-analysis-reports
          path: |
            industry_analysis_*.csv
            industry_period_*.csv
            industry_account_*.csv
          retention-days: 30