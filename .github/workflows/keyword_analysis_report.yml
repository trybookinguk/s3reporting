name: Keyword Analysis Report

on:
  workflow_dispatch:      # Manual trigger only
    inputs:
      keywords:
        description: 'Comma-separated keywords for focused analysis (leave empty for full report)'
        required: false
        default: ''
        type: string
      top_n:
        description: 'Number of top keywords to analyse'
        required: false
        default: '100'
        type: string

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas requests pytz python-dateutil

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache S3 files
        uses: actions/cache@v3
        with:
          path: .cache
          key: s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-keyword-analysis
          restore-keys: |
            s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-
            s3-cache-${{ runner.os }}-

      - name: Run Keyword Analysis Report
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        run: |
          OUTPUT_FILE="keyword_analysis_report.csv"
          KEYWORDS="${{ github.event.inputs.keywords }}"
          TOP_N="${{ github.event.inputs.top_n }}"

          # Build command
          CMD="python3 keyword_analysis_report.py --output $OUTPUT_FILE --top-n $TOP_N"

          if [ -n "$KEYWORDS" ]; then
            echo "Running focused keyword analysis for: $KEYWORDS"
            CMD="$CMD --keywords \"$KEYWORDS\""
          else
            echo "Running full keyword analysis report..."
          fi

          eval $CMD

      - name: List generated files
        if: always()
        run: |
          echo "=== Generated report files ==="
          ls -la keyword_analysis_report*.csv 2>/dev/null || echo "No keyword report files found"
          ls -la *_focused_*.csv 2>/dev/null || echo "No focused report files found"
          ls -la *_keywords_*.csv 2>/dev/null || echo "No keyword CSV files found"
          ls -la *_popularity_*.csv 2>/dev/null || echo "No popularity files found"

      - name: Upload Keyword Analysis Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keyword-analysis-report-${{ steps.date.outputs.date }}
          path: |
            keyword_analysis_report*.csv
            *_keywords_*.csv
            *_popularity_*.csv
            *_focused_*.csv
          retention-days: 90
