name: Monthly Reports

on:
  schedule:
    # Run at 09:00 UTC on the 1st of every month
    - cron: '0 9 1 * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode - send emails only to alex@trybooking.co.uk'
        required: false
        type: boolean
        default: true
      debug_mode:
        description: 'Debug mode - show detailed debugging information'
        required: false
        type: boolean
        default: false
      show_all_accounts:
        description: 'Show all accounts in the month (requires debug mode)'
        required: false
        type: boolean
        default: false

jobs:
  monthly-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas requests pytz python-dateutil msal
          
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        
      - name: Cache S3 files
        uses: actions/cache@v3
        with:
          path: .cache
          key: s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-monthly-reports
          restore-keys: |
            s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-
            s3-cache-${{ runner.os }}-
            
      - name: Run Monthly Report
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SENDER_MAILBOX: ${{ secrets.AZURE_SENDER_MAILBOX }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
          DEBUG_SHOW_ALL_ACCOUNTS: ${{ github.event.inputs.show_all_accounts }}
        run: |
          echo "Running Monthly Report..."
          if [[ "$DEBUG_MODE" == "true" ]]; then
            echo "Debug mode enabled"
            if [[ "$DEBUG_SHOW_ALL_ACCOUNTS" == "true" ]]; then
              echo "Will show all accounts in the month"
            fi
          fi
          python monthly_reporting.py