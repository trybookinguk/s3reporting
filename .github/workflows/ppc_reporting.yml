name: PPC Reporting

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Run in test mode'
        required: false
        type: boolean
        default: false

jobs:
  ppc-report:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    
    - name: Get current date
      id: date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        echo "Report will run from 2024-06-01 to $(date +'%Y-%m-%d')"
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install boto3 pandas requests pytz python-dateutil packaging
        pip install google-analytics-data google-auth google-auth-oauthlib google-auth-httplib2
    
    - name: Cache S3 files
      uses: actions/cache@v5
      with:
        path: .cache
        key: s3-cache-${{ steps.date.outputs.date }}
        restore-keys: |
          s3-cache-
    
    - name: Run PPC Report
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
        GA4_PROPERTY_ID: ${{ secrets.GA4_PROPERTY_ID }}
        GA4_SERVICE_ACCOUNT_KEY: ${{ secrets.GA4_SERVICE_ACCOUNT_KEY }}
        TEST_MODE: ${{ github.event.inputs.test_mode }}
      run: |
        python ppc_reporting.py \
          --output-file ppc_report_2024-06-01_${{ steps.date.outputs.date }}.csv \
          ${{ github.event.inputs.test_mode == 'true' && '--test-mode' || '' }}
    
    - name: Upload report artifact
      uses: actions/upload-artifact@v7
      with:
        name: ppc-report-2024-06-01-to-${{ steps.date.outputs.date }}
        path: ppc_report_*.csv
        retention-days: 90
