name: Pricing Model Comparison

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to analyse'
        required: false
        type: string
        default: '2025'

jobs:
  pricing-comparison:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas requests pytz

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache S3 files
        uses: actions/cache@v3
        with:
          path: .cache
          key: s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-pricing
          restore-keys: |
            s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-
            s3-cache-${{ runner.os }}-

      - name: Run Pricing Model Comparison
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          ANALYSIS_YEAR: ${{ github.event.inputs.year }}
        run: python pricing_model_comparison.py

      - name: Upload output files
        uses: actions/upload-artifact@v4
        with:
          name: pricing-comparison-${{ steps.date.outputs.date }}
          path: output/pricing_*.csv
          retention-days: 30
