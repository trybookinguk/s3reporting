name: Weekly Reports

on:
  schedule:
    - cron: '0 8 * * 2'  # Every Tuesday at 08:00 UTC (09:00 BST)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode - send emails only to alex@trybooking.co.uk'
        required: false
        type: boolean
        default: false
      send_emails:
        description: 'Send email reports'
        required: false
        type: boolean
        default: true
      run_salesiq:
        description: 'Run SalesIQ report'
        required: false
        type: boolean
        default: true
      run_accounts:
        description: 'Run Weekly Accounts report'
        required: false
        type: boolean
        default: true
      test_date:
        description: 'Override test date (YYYY-MM-DD format) - leave empty for current date'
        required: false
        type: string

jobs:
  weekly-reports:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas requests pytz msal
          
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        
      - name: Cache S3 files
        uses: actions/cache@v3
        with:
          path: .cache
          key: s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-weekly-reports
          restore-keys: |
            s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-
            s3-cache-${{ runner.os }}-
            
      - name: Set environment variables
        run: |
          # For scheduled runs, always send emails
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "SEND_EMAIL=1" >> $GITHUB_ENV
          else
            # For manual runs, respect the input
            if [ "${{ github.event.inputs.send_emails }}" = "false" ]; then
              echo "SEND_EMAIL=0" >> $GITHUB_ENV
            else
              echo "SEND_EMAIL=1" >> $GITHUB_ENV
            fi
          fi
          
          # Set test date if provided
          if [ -n "${{ github.event.inputs.test_date }}" ]; then
            echo "TEST_DATE=${{ github.event.inputs.test_date }}" >> $GITHUB_ENV
          fi
          
      - name: Run SalesIQ Weekly Report
        if: github.event_name == 'schedule' || github.event.inputs.run_salesiq == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_PORTAL_NAME: ${{ secrets.ZOHO_PORTAL_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SENDER_MAILBOX: ${{ secrets.AZURE_SENDER_MAILBOX }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
        run: |
          echo "Running SalesIQ Weekly Report..."
          if [ "$SEND_EMAIL" = "0" ]; then
            echo "Email sending disabled for this run"
          fi
          python salesiq_weekly.py
          
      - name: Run Weekly Account Reporting
        if: github.event_name == 'schedule' || github.event.inputs.run_accounts == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SENDER_MAILBOX: ${{ secrets.AZURE_SENDER_MAILBOX }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
        run: |
          echo "Running Weekly Account Reporting..."
          if [ "$SEND_EMAIL" = "0" ]; then
            python weekly_reporting_unified.py --no-email
          else
            python weekly_reporting_unified.py
          fi
          
