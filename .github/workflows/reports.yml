name: Weekly Reports
on:
  schedule:
    - cron: '0 8 * * 2'  # Every Tuesday at 08:00 UTC (09:00 BST)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode - send emails only to alex@trybooking.co.uk'
        required: false
        type: boolean
        default: false

jobs:
  run-reports:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install boto3 pandas requests
      - name: Run SalesIQ Weekly Report
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_PORTAL_NAME: ${{ secrets.ZOHO_PORTAL_NAME }}
          MAILGUN_SMTP_LOGIN: ${{ secrets.MAILGUN_SMTP_LOGIN }}
          MAILGUN_SMTP_PASSWORD: ${{ secrets.MAILGUN_SMTP_PASSWORD }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
        run: python salesiq_weekly.py
      - name: Run Weekly Account Reporting
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          MAILGUN_SMTP_LOGIN: ${{ secrets.MAILGUN_SMTP_LOGIN }}
          MAILGUN_SMTP_PASSWORD: ${{ secrets.MAILGUN_SMTP_PASSWORD }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
        run: python weekly_reporting.py