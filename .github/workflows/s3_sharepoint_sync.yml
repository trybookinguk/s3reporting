name: S3 to SharePoint Sync

on:
  schedule:
    - cron: '0 2 * * *'  # Daily at 02:00 UTC (after S3 midnight refresh)
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Preview changes without uploading'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 msal requests

      - name: Restore sync manifest cache
        uses: actions/cache@v3
        with:
          path: .sync_manifest
          key: sharepoint-sync-manifest

      - name: Run S3 to SharePoint sync
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SHAREPOINT_SITE_ID: ${{ secrets.SHAREPOINT_SITE_ID }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          SHAREPOINT_FOLDER: ${{ secrets.SHAREPOINT_FOLDER }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python s3_to_sharepoint.py --dry-run
          else
            python s3_to_sharepoint.py
          fi
