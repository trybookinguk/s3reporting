name: Sales Commission Report

on:
  schedule:
    # Run at 09:00 UTC on the 2nd of every month
    - cron: '0 9 2 * *'
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode - send emails only to alex@trybooking.co.uk'
        required: false
        type: boolean
        default: true
      report_month:
        description: 'Report month: YYYY-MM for specific month, "all" for all historical, empty for previous month'
        required: false
        type: string

jobs:
  sales-commission:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install system dependencies for WeasyPrint
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf2.0-0 libffi-dev shared-mime-info

      - name: Install Python dependencies
        run: pip install boto3 pandas requests pytz python-dateutil weasyprint msal

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache S3 files
        uses: actions/cache@v3
        with:
          path: .cache
          key: s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-commission
          restore-keys: |
            s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-
            s3-cache-${{ runner.os }}-

      - name: Run Sales Commission Report
        env:
          AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SENDER_MAILBOX: ${{ secrets.AZURE_SENDER_MAILBOX }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
          REPORT_MONTH: ${{ github.event.inputs.report_month || '' }}
          # SCHEDULED_RUN is true only for cron-triggered runs (not manual dispatch)
          SCHEDULED_RUN: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
        run: python sales_commission_report.py
