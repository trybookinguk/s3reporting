name: SalesIQ Monthly Report

on:
  workflow_dispatch:
    inputs:
      year:
        description: 'Year to generate report for (e.g., 2025)'
        required: true
        type: string
      output_filename:
        description: 'Output filename (optional, defaults to salesiq_monthly_YYYY.csv)'
        required: false
        type: string

jobs:
  generate-report:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas requests pytz

      - name: Generate SalesIQ Monthly Report
        env:
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_PORTAL_NAME: ${{ secrets.ZOHO_PORTAL_NAME }}
        run: |
          echo "Generating SalesIQ Monthly Report for ${{ github.event.inputs.year }}..."

          # Build command with optional output filename
          CMD="python salesiq_monthly_report.py --year ${{ github.event.inputs.year }}"

          if [ -n "${{ github.event.inputs.output_filename }}" ]; then
            CMD="$CMD --output ${{ github.event.inputs.output_filename }}"
          fi

          $CMD

      - name: Upload CSV Report
        uses: actions/upload-artifact@v4
        with:
          name: salesiq-monthly-report-${{ github.event.inputs.year }}
          path: salesiq_monthly_*.csv
          retention-days: 90
