name: Tier Movements

# Manual-only workflow for running the tier pipeline (zoho_tiers.py) on its
# own — without the dashboard generation, S3->SharePoint sync, or industry
# sync that daily_sync.yml does. Useful for:
#   - Test-mode preview runs (TEST_MODE=true) to validate emails before they
#     fire to real owners.
#   - One-off rebuilds of tier_history.json (--rebuild-history).
#   - Re-running the daily tier path off-schedule (e.g. after a fix).
#
# The scheduled run lives in daily_sync.yml; this workflow does NOT run on
# a cron — it's manual only.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        required: true
        default: 'daily'
        type: choice
        options:
          - 'daily'             # full v1 + Zoho upsert + tier-movement emails
          - 'rebuild-history'   # replay tier_history.json from BookingDataAll
      test_mode:
        description: 'Test mode (redirect emails to alex@, suppress Zoho upsert)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      dry_run:
        description: 'Dry run (skip SharePoint writes — tier_history/snapshot untouched)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      rebuild_from_scratch:
        description: 'rebuild-history only: discard existing tier_history.json'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'
      history_from:
        description: 'rebuild-history only: start date (YYYY-MM-DD), default 12y ago'
        required: false
        default: ''
      history_to:
        description: 'rebuild-history only: end date (YYYY-MM-DD), default today'
        required: false
        default: ''

jobs:
  tier-movements:
    name: Run zoho_tiers.py
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 msal requests pandas pytz numpy scipy matplotlib

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache S3 files
        uses: actions/cache@v3
        with:
          path: .cache
          key: s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}
          restore-keys: |
            s3-cache-${{ runner.os }}-

      - name: Run zoho_tiers.py
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          ZOHO_ORG_ID: ${{ secrets.ZOHO_ORG_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SENDER_MAILBOX: ${{ secrets.AZURE_SENDER_MAILBOX }}
          SHAREPOINT_DRIVE_ID: ${{ secrets.SHAREPOINT_DRIVE_ID }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.mode }}" = "rebuild-history" ]; then
            ARGS="$ARGS --rebuild-history"
            if [ "${{ github.event.inputs.rebuild_from_scratch }}" = "true" ]; then
              ARGS="$ARGS --rebuild-from-scratch"
            fi
            if [ -n "${{ github.event.inputs.history_from }}" ]; then
              ARGS="$ARGS --history-from ${{ github.event.inputs.history_from }}"
            fi
            if [ -n "${{ github.event.inputs.history_to }}" ]; then
              ARGS="$ARGS --history-to ${{ github.event.inputs.history_to }}"
            fi
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          echo "Running: python zoho_tiers.py $ARGS"
          python zoho_tiers.py $ARGS

      - name: Upload Tier Report CSV
        uses: actions/upload-artifact@v4
        if: always() && github.event.inputs.mode == 'daily'
        with:
          name: tier-report
          path: tier_updates_*.csv
          retention-days: 30
