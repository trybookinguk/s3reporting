name: Weekly Domain Report

on:
  schedule:
    - cron: '0 9 * * 1'  # Every Monday at 09:00 UTC (10:00 BST)
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode - send emails only to alex@trybooking.co.uk'
        required: false
        type: boolean
        default: false
      send_emails:
        description: 'Send email reports'
        required: false
        type: boolean
        default: true

jobs:
  domain-report:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas requests pytz python-dateutil msal
          
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
        
      - name: Cache S3 files
        uses: actions/cache@v3
        with:
          path: .cache
          key: s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-domain-report
          restore-keys: |
            s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}
            s3-cache-${{ runner.os }}-
            
      - name: Run Domain Report (Test Mode)
        if: ${{ github.event.inputs.test_mode == 'true' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SENDER_MAILBOX: ${{ secrets.AZURE_SENDER_MAILBOX }}
          TEST_MODE: 'true'
          SEND_EMAILS: ${{ github.event.inputs.send_emails != 'false' }}
        run: |
          echo "Running in TEST MODE - emails will be sent to alex@trybooking.co.uk only"
          if [ "${{ github.event.inputs.send_emails }}" == "false" ]; then
            echo "Email sending disabled - generating report only"
          fi
          python weekly_domain_report.py
          
      - name: Run Domain Report (Production)
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.test_mode == 'false') }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SENDER_MAILBOX: ${{ secrets.AZURE_SENDER_MAILBOX }}
          TEST_MODE: 'false'
          SEND_EMAILS: ${{ github.event_name == 'schedule' || github.event.inputs.send_emails != 'false' }}
        run: |
          echo "Running in PRODUCTION MODE"
          python weekly_domain_report.py
          
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: domain-report-${{ steps.date.outputs.date }}
          path: |
            email_domains_*.csv
            /tmp/email_domains_*.csv
          retention-days: 30
          if-no-files-found: ignore