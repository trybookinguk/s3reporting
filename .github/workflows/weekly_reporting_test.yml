# .github/workflows/weekly-reporting-test.yml
name: Weekly Reporting Test (No Email)

on:
  workflow_dispatch:
    inputs:
      test_date:
        description: 'Override test date (YYYY-MM-DD format) - leave empty for current date'
        required: false
        type: string
      debug_mode:
        description: 'Enable extra debug output'
        required: false
        type: boolean
        default: false

jobs:
  test-weekly-report:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas boto3
        
    - name: Set test date if provided
      if: ${{ github.event.inputs.test_date != '' }}
      run: |
        echo "TEST_DATE=${{ github.event.inputs.test_date }}" >> $GITHUB_ENV
        
    - name: Run weekly reporting test
      env:
        AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
      run: |
        if [ -n "$TEST_DATE" ]; then
          echo "Running with test date: $TEST_DATE"
          python -c "
import os
from datetime import datetime
os.environ['OVERRIDE_DATE'] = '$TEST_DATE'
exec(open('weekly_reporting_noemail.py').read())
"
        else
          echo "Running with current date"
          python weekly_reporting_noemail.py
        fi
        
    - name: Upload logs as artifact
      if: always()
      uses: actions/upload-artifact@v3
      with:
        name: weekly-report-test-logs
        path: |
          *.log
          *.txt
        retention-days: 7