name: Update Tiers and Ratings

on:
  workflow_dispatch:     # Manual trigger
    inputs:
      test_mode:
        description: 'Run in test mode (no Zoho updates)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  update-tiers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas requests pytz numpy

      - name: Run Tier Update Script
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          TEST_MODE: ${{ github.event.inputs.test_mode }}
        run: python zoho_tiers.py
      
      - name: Upload Tier Report CSV
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: tier-report
          path: tier_updates_*.csv
          retention-days: 30
