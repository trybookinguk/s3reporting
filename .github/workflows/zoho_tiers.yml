name: Update Tiers, Ratings & Annual Events

on:
  schedule:
    - cron: '0 4 * * 1'  # Every Monday at 4:00 AM UTC
  workflow_dispatch:     # Manual trigger
    inputs:
      test_mode:
        description: 'Run in test mode (no Zoho updates)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

jobs:
  update-tiers:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install boto3 pandas requests pytz numpy scipy

      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Cache S3 files
        uses: actions/cache@v3
        with:
          path: .cache
          # Cache key includes date to ensure fresh data each day
          key: s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-${{ hashFiles('**/zoho_tiers.py') }}
          restore-keys: |
            s3-cache-${{ runner.os }}-${{ steps.date.outputs.date }}-
            s3-cache-${{ runner.os }}-

      - name: Run Tier Update Script
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_KEY }}
          ZOHO_CLIENT_ID: ${{ secrets.ZOHO_CLIENT_ID }}
          ZOHO_CLIENT_SECRET: ${{ secrets.ZOHO_CLIENT_SECRET }}
          ZOHO_REFRESH_TOKEN: ${{ secrets.ZOHO_REFRESH_TOKEN }}
          MAILGUN_SMTP_LOGIN: ${{ secrets.MAILGUN_SMTP_LOGIN }}
          MAILGUN_SMTP_PASSWORD: ${{ secrets.MAILGUN_SMTP_PASSWORD }}
          MAILGUN_DOMAIN: ${{ secrets.MAILGUN_DOMAIN }}
          TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        run: python zoho_tiers.py
      
      - name: Upload Tier Report CSV
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tier-report
          path: tier_updates_*.csv
          retention-days: 30
      
      - name: Upload Annual Events Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: annual-events-report
          path: upcoming_annual_events_*.csv
          retention-days: 30
