# Pricing scenarios for 2026 modelling.
#
# Three independent comparison groups. In each group, only one rule varies —
# the other two are held at the baseline (current 5% + 15p inc VAT online,
# 75p inc VAT stripe, 5% + 15p inc VAT box office card).
#
# Each rule is: percent, pence (per ticket), includes_vat (bool).

online:
  - name: "5% + 15p inc VAT (do nothing)"
    percent: 5.0
    pence: 15
    includes_vat: true
  - name: "5% + 20p inc VAT"
    percent: 5.0
    pence: 20
    includes_vat: true
  - name: "5% + 25p inc VAT"
    percent: 5.0
    pence: 25
    includes_vat: true
  - name: "4% + 20p ex VAT"
    percent: 4.0
    pence: 20
    includes_vat: false
  - name: "4% + 25p ex VAT"
    percent: 4.0
    pence: 25
    includes_vat: false

stripe:
  - name: "75p inc VAT (do nothing)"
    percent: 0.0
    pence: 75
    includes_vat: true
  - name: "75p ex VAT"
    percent: 0.0
    pence: 75
    includes_vat: false

box_office_card:
  - name: "5% + 15p inc VAT (do nothing)"
    percent: 5.0
    pence: 15
    includes_vat: true
  - name: "2% + 15p ex VAT"
    percent: 2.0
    pence: 15
    includes_vat: false
  - name: "2% + 20p ex VAT"
    percent: 2.0
    pence: 20
    includes_vat: false
  - name: "2.5% + 20p ex VAT"
    percent: 2.5
    pence: 20
    includes_vat: false
  - name: "3% + 15p ex VAT"
    percent: 3.0
    pence: 15
    includes_vat: false
  - name: "3% + 20p ex VAT"
    percent: 3.0
    pence: 20
    includes_vat: false
  - name: "2.5% + 20p inc VAT"
    percent: 2.5
    pence: 20
    includes_vat: true
  - name: "3% + 20p inc VAT"
    percent: 3.0
    pence: 20
    includes_vat: true
